<!--/*
    Custom Image - art-directed responsive image.

    This component owns no image-delivery logic and, now, no image markup either. It
    composes two independent Core Image v3 resources - the ./desktop child and the
    ./mobile child - into a native <picture> element:

        <picture>  -> the browser picks the image FAMILY (mobile vs desktop)
        srcset     -> the browser picks the RESOLUTION within that family

    Each child is re-typed by CustomImageImpl to a hidden component that renders exactly
    one element (custom-image/source or custom-image/img) and included here. decoration
    is switched off on both includes: <picture> only drives <source> and <img> elements
    that are its DIRECT children, so an AEM decoration <div> around either of them would
    silently disable art direction while still looking fine in the markup.

    src / srcset / sizes / width / height / alt all come straight from the Core Image v3
    public API, so Adaptive Image Servlet URLs, Web Optimized Image Delivery (Asset
    Delivery) URLs and Dynamic Media URLs are all passed through untouched. There is
    deliberately no JavaScript that swaps sources based on the viewport width.
*/-->
<sly data-sly-use.customImage="com.aemcloudproject.core.models.CustomImage"
     data-sly-use.templates="core/wcm/components/commons/v1/templates.html"
     data-sly-test.desktopImage="${customImage.desktopImageResource}">

    <picture class="cmp-custom-image">

        <!--/* Mobile family. Included only when a mobile asset is actually authored, so
               there is never an empty <source>. */-->
        <sly data-sly-test="${customImage.mobileImageResource}">
            <sly data-sly-resource="${customImage.mobileImageResource @ decoration=false}"></sly>
        </sly>

        <!--/* Desktop family and fallback. Owns the semantic alternative text. */-->
        <sly data-sly-resource="${desktopImage @ decoration=false}"></sly>
    </picture>
</sly>
<sly data-sly-call="${templates.placeholder @ isEmpty = !customImage.hasDesktopImage, classAppend = 'cmp-custom-image'}"></sly>
