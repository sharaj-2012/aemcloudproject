<!--/*
    Goal Based Calculator Tabs (super type: aemcloudproject/components/tabs -> core tabs v1)

    Renders: background image, heading, the tab list ("Your Goal"), one tab panel
    per tab item, and the CTAs. Each tab item is a goal-based-investment-calculator
    (Vacation, Car, ...) that renders its own form AND result card; this component
    only includes it inside its tab panel and never renders any part of it itself.

    Rules that keep core tabs.js working:
      - The tab list (<ol>) is rendered ONCE, outside the tab panel repeat. Core
        tabs.js collects all [data-cmp-hook-tabs="tab"] and
        [data-cmp-hook-tabs="tabpanel"] elements and pairs them by index, so the
        tab list must produce exactly one tab per tab panel, in the same order.
      - Core tabs.js shows/hides whole tab panels, so a calculator's form and result
        switch together with no extra JS.

    Layout (goal list + form left, result + CTAs right) is done in CSS: see
    clientlibs/css/goal-based-calculator.css.
*/-->
<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-call="${clientlib.css @ categories='aemcloudproject.goal-based-calculator'}"/>
<!--/*
    Editor contract (core panel container, "cmp-tabs" type):
      - data-panelcontainer="tabs" must sit on the component's top-level element; the
        editor uses it to recognise this component as a tab container.
      - class="cmp-tabs" marks the element the editor treats as the tabs, and it
        looks for the tab panels as that element's DIRECT children
        (".cmp-tabs > [data-cmp-hook-tabs='tabpanel']"). So cmp-tabs, id,
        data-cmp-is and data-cmp-data-layer live on .sc-goal-based-calculator__inner
        below, whose direct children are the tab panels - not on this root, where the
        panels are nested three levels deep.
*/-->
<div data-sly-use.tabs="com.adobe.cq.wcm.core.components.models.Tabs"
     data-panelcontainer="${wcmmode.edit && 'tabs'}"
     class="sc-goal-based-calculator sc-module-bg"
     data-author-edit-mode="${wcmmode.edit ? 'true' : 'false'}"
     data-placeholder-text="${wcmmode.edit && 'Please drag Tab components here' @ i18n, locale=request.locale}">
    <sly data-sly-set.items="${tabs.children || tabs.items}"/>
    <sly data-sly-set.desktopImagePath="${properties.desktopImagePath}"/>
    <sly data-sly-set.mobileImagePath="${properties.mobileImagePath}"/>
    <sly data-sly-set.fallbackImagePath="${desktopImagePath || mobileImagePath}"/>
    <sly data-sly-set.primaryIsPage="${'/content/' in properties.primaryCtaLink}"/>
    <sly data-sly-set.secondaryIsPage="${'/content/' in properties.secondaryCtaLink}"/>

    <div class="sc-module-bg__img-wrapper" data-sly-test="${fallbackImagePath}">
        <picture class="sc-module-bg__picture">
            <source data-sly-test="${mobileImagePath}" srcset="${mobileImagePath @ context='uri'}" media="(max-width: 767px)">
            <source data-sly-test="${desktopImagePath}" srcset="${desktopImagePath @ context='uri'}" media="(min-width: 768px)">
            <img src="${fallbackImagePath @ context='uri'}" class="sc-module-bg__img"
                 loading="eager" fetchpriority="high" decoding="async"
                 alt="${properties.desktopImageAltText}"/>
        </picture>
    </div>

    <div class="sc-content-wrapper">
        <div class="sc-heading-inner sc-title--center">
            <div class="sc-heading-inner__wrapper">
                <h2 class="sc-title sc-title--inner">${properties.headingTitle}</h2>
                <div class="sc-description" data-sly-test="${properties.headingDescription}">
                    <p>${properties.headingDescription}</p>
                </div>
            </div>
        </div>

        <div class="sc-goal-based-calculator__wrapper" data-sly-test="${items.size > 0}">
            <div class="sc-goal-based-calculator__inner cmp-tabs"
                 id="${tabs.id}"
                 data-cmp-is="tabs"
                 data-cmp-data-layer="${tabs.data.json}">

                <!-- Tab list: once, outside the tab panel repeat (see header comment). -->
                <div class="sc-goal-based-calculator__goals">
                    <div class="sc-goal-based-calculator__title" id="${tabs.id}-goal-title">${properties.yourGoalLabel}</div>
                    <ol data-sly-list.tab="${items}"
                        role="tablist"
                        class="cmp-tabs__tablist sc-goal-based-calculator__radios"
                        aria-labelledby="${tabs.id}-goal-title"
                        aria-multiselectable="false">
                        <sly data-sly-test.isActive="${tab.name == tabs.activeItem}"/>
                        <li role="tab"
                            id="${tab.id}-tab"
                            class="cmp-tabs__tab sc-goal-based-calculator__radio${isActive ? ' cmp-tabs__tab--active' : ''}"
                            aria-controls="${tab.id}-tabpanel"
                            aria-selected="${isActive ? 'true' : 'false'}"
                            tabindex="${isActive ? '0' : '-1'}"
                            data-goal="${tab.name}"
                            data-cmp-hook-tabs="tab">${tab.title}</li>
                    </ol>
                </div>

                <!-- Tab panels: one per tab item, holding only that item's resource
                     (the calculator renders its own form and result card). -->
                <div data-sly-repeat.item="${items}"
                     id="${item.id}-tabpanel"
                     role="tabpanel"
                     aria-labelledby="${item.id}-tab"
                     tabindex="0"
                     class="cmp-tabs__tabpanel${item.name == tabs.activeItem ? ' cmp-tabs__tabpanel--active' : ''}"
                     data-cmp-hook-tabs="tabpanel"
                     data-cmp-data-layer="${item.data.json}"
                     data-sly-resource="${item.resource @ decorationTagName='div'}"></div>

                <!-- CTAs: authored on this component and shared by every goal, rendered once. -->
                <ul class="sc-inline-buttons sc-goal-based-calculator__actions"
                    data-sly-test="${properties.primaryCtaLabel || properties.secondaryCtaLabel}">
                    <li class="sc-inline-buttons__item" data-sly-test="${properties.primaryCtaLabel && properties.primaryCtaLink}">
                        <a class="sc-btn" href="${properties.primaryCtaLink}${primaryIsPage ? '.html' : ''}"
                           title="${properties.primaryCtaLabel}">${properties.primaryCtaLabel}</a>
                    </li>
                    <li class="sc-inline-buttons__item sc-goal-based-calculator__learn-more-item" data-sly-test="${properties.secondaryCtaLabel && properties.secondaryCtaLink}">
                        <a class="sc-btn sc-btn--secondary-blue sc-goal-based-calculator__learn-more-btn"
                           href="${properties.secondaryCtaLink}${secondaryIsPage ? '.html' : ''}"
                           title="${properties.secondaryCtaLabel}">${properties.secondaryCtaLabel}</a>
                    </li>
                </ul>

            </div>
        </div>

        <sly data-sly-resource="${resource.path @ resourceType='wcm/foundation/components/parsys/newpar', appendPath='/*', decorationTagName='div', cssClassName='new section aem-Grid-newComponent'}"
             data-sly-test="${(wcmmode.edit || wcmmode.preview) && (!items || items.size < 1)}"/>
    </div>
</div>
<sly data-sly-call="${clientlib.js @ categories='aemcloudproject.goal-based-calculator'}"/>
