<div class="aemcloudproject-jsoneditor">
    <p id="jsonchanges-path" class="aemcloudproject-jsoneditor__path"></p>
    <p id="jsonchanges-summary" class="aemcloudproject-jsoneditor__status" hidden></p>
    <div id="jsonchanges-error" class="aemcloudproject-jsoneditor__error" role="alert" hidden></div>
    <div id="jsonchanges-view" class="aemcloudproject-jsoneditor__compare" hidden>
        <label><input type="checkbox" id="jsonchanges-normalize"> Normalize formatting</label>
        <p id="jsonchanges-message" hidden></p>
        <div id="jsonchanges-diff" class="aemcloudproject-jsoneditor__diff"></div>
    </div>
</div>
