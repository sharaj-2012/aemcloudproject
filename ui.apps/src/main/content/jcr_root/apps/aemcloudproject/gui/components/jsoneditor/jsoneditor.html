<div class="aemcloudproject-jsoneditor">
    <p id="jsoneditor-path" class="aemcloudproject-jsoneditor__path"></p>
    <p id="jsoneditor-status" class="aemcloudproject-jsoneditor__status" role="status"></p>
    <div id="jsoneditor-error" class="aemcloudproject-jsoneditor__error" role="alert" hidden></div>
    <div id="jsoneditor-panes" class="aemcloudproject-jsoneditor__panes">
        <div id="jsoneditor-left" class="aemcloudproject-jsoneditor__pane"></div>
        <div class="aemcloudproject-jsoneditor__pane">
            <p id="jsoneditor-stale" class="aemcloudproject-jsoneditor__stale" hidden>Preview out of date — fix errors</p>
            <div id="jsoneditor-right" class="aemcloudproject-jsoneditor__preview"></div>
        </div>
    </div>
    <div id="jsoneditor-compare-view" class="aemcloudproject-jsoneditor__compare" hidden>
        <label><input type="checkbox" id="jsoneditor-normalize"> Normalize formatting</label>
        <p id="jsoneditor-compare-message" hidden></p>
        <div id="jsoneditor-diff"></div>
    </div>
</div>
